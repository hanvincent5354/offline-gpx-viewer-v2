  <!-- Foreground Trees -->
  <path d="M 60 456 L 80 390 L 100 456 Z" fill="#10b981"/>
  <path d="M 100 456 L 115 410 L 130 456 Z" fill="#059669"/>
  <path d="M 380 456 L 400 370 L 420 456 Z" fill="#10b981"/>
