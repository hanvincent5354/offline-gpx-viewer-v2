<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- Mountain Gradient -->
    <linearGradient id="mountain-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <!-- Glow Filter for GPS Dot -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Mountain Peaks -->
  <path d="M 64 416 L 224 220 L 304 310 L 400 180 L 448 240 L 448 416 Z" fill="#064e3b" opacity="0.5" />
  <path d="M 64 416 L 192 240 L 288 350 L 384 200 L 448 416 Z" fill="url(#mountain-grad)" />

  <!-- Hiking Trail Polyline (High-Contrast Neon Yellow) -->
  <path d="M 96 390 Q 150 370 170 320 T 250 320 T 320 250 T 384 200" 
        fill="none" 
        stroke="#facc15" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        stroke-dasharray="1 25" />

  <!-- Glow effect under GPS Dot -->
  <circle cx="384" cy="200" r="28" fill="#3b82f6" opacity="0.4" filter="url(#glow)" />
  
  <!-- GPS Blue Dot Location Marker -->
  <circle cx="384" cy="200" r="18" fill="#3b82f6" stroke="#ffffff" stroke-width="5" />
</svg>
